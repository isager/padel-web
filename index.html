<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Mexicano Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h2>🎾 Padel Mexicano Manager</h2>

    <!-- Player Entry -->
    <div class="card">
        <h3>Add Players (Min 4)</h3>
        <input type="text" id="playerName" placeholder="Player Name">
        <button id="btnAddPlayer">Add Player</button>
        <ul id="playerList"></ul>
        <button id="btnGenerateRound" style="background: #28a745;">Generate Matches</button>
    </div>

    <!-- Match Generation -->
    <div class="card">
        <h3>Current Round Matches</h3>
        <div id="matchesContainer">No matches generated yet.</div>
    </div>

    <!-- Standings -->
    <div class="card">
        <h3>Leaderboard</h3>
        <ul id="leaderboard"></ul>
    </div>

    <!-- Reset Data -->
    <div class="card">
        <button id="btnResetTournament" class="btn-danger">Reset Entire Tournament</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
