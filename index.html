<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Mexicano Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header class="app-header">
        <h1>🎾 Padel Mexicano Manager</h1>
        <p class="subtitle">Dynamic pairings based on live standings</p>
    </header>

    <div class="card">
        <h2>Add Players <span class="hint">(min 4)</span></h2>
        <div class="input-row">
            <input type="text" id="playerName" placeholder="Player name">
            <button id="btnAddPlayer">Add Player</button>
        </div>
        <ul id="playerList"></ul>
        <button id="btnGenerateRound" class="btn-success">Generate Next Round</button>
    </div>

    <div class="card">
        <h2 id="roundLabel">No round yet</h2>
        <div id="matchesContainer" class="matches-container">No matches generated yet.</div>
    </div>

    <div class="card">
        <h2>Leaderboard</h2>
        <ul id="leaderboard"></ul>
    </div>

    <div class="card card-danger">
        <button id="btnResetTournament" class="btn-danger">Reset Entire Tournament</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
